[tool.ruff]
extend = "../../ruff.toml"
lint.isort.known-local-folder = [ "hohonu_api" ]

[tool.pytest]
pythonpath = [ "." ]
minversion = "9"

[tool.coverage.run]
omit = [
  ".pixi/*",
]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "hohonu_defs"

[tool.pixi.workspace]
authors = [ "Alex Kerney <abk@mac.com>" ]
channels = [ "conda-forge" ]
name = "hohonu"
platforms = [ "linux-64", "linux-aarch64" ]
version = "0.1.0"

[tool.pixi.tasks]

[tool.pixi.dependencies]
ioos_qc = ">=2.2.1,<3"
pandas = ">=3.0.1,<4"
pydantic = ">=2.11.9,<3"
httpx = ">=0.28.1,<0.29"
xarray = ">=2025.9.0,<2026"
netcdf4 = ">=1.7.2,<2"
sentry-sdk = ">=2.43.0,<3"
dagster = ">=1.13,<2"
dagster-dg-cli = ">=1.13,<2"
s3fs = ">=2025.9.0,<2026"
parse = ">=1.20.2,<2"
dagster-k8s = ">=1!0.29,<1!0.30"
dagster-postgres = ">=1!0.29,<1!0.30"
dagster-aws = ">=1!0.29,<1!0.30"
pint = ">=0.25,<0.26"
pyyaml = ">=6.0.2,<7"
pyarrow = ">=24.0.0,<25"

[tool.pixi.feature.dev.dependencies]
pytest = ">=9"
pytest-recording = ">=0.13.4,<0.14"
pytest-cov = "*"
pytest-regressions = ">=2.11.0,<3"

[tool.pixi.feature.dev.tasks]
pytest = "pytest -vv --ignore=common --record-mode=once"

[tool.pixi.environments]
dev = [ "dev" ]
