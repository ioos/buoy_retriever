name: Pipeline - S3 Timeseries

on:
    push:
        branches:
            - main
        paths:
            - common/**
            - pipeline/s3_timeseries/**
            - .github/workflows/_shortsha.yml
            - .github/workflows/_build_image.yml
            - .github/workflows/pipeline_s3_timeseries.yml
    pull_request:
        paths:
            - common/**
            - pipeline/s3_timeseries/**
            - .github/workflows/_shortsha.yml
            - .github/workflows/_build_image.yml
            - .github/workflows/pipeline_s3_timeseries.yml
    workflow_dispatch:

jobs:
    shortsha:
        uses: ./.github/workflows/_shortsha.yml

    build_test_push:
        needs: [shortsha]
        uses: ./.github/workflows/_build_image.yml
        secrets: inherit
        permissions:
            contents: read
            packages: write
        with:
            working_directory: ./pipeline/s3_timeseries
            image_name: buoy_retriever_s3_timeseries
            image_tag: ${{ needs.shortsha.outputs.shortsha }}
            push_image: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
            test_command: "pixi run pytest --cov=. --cov-report=xml:/tmp/coverage.xml --cov-report=term-missing --junitxml=/tmp/junit.xml -o junit_family=legacy"
            coverage_flags: s3_timeseries
            upload_tests: true

    deploy:
        needs: [shortsha, build_test_push]
        uses: ./.github/workflows/_notify.yml
        if: ${{ github.repository == 'ioos/buoy_retriever' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        with:
            tag: ${{ needs.build_test_push.outputs.image_ref }}
            image_name: ${{ needs.build_test_push.outputs.image_name }}
            digest: ${{ needs.build_test_push.outputs.digest }}
        secrets: inherit
